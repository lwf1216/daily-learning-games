name: 打包桌面版与iOS版
# 用途：daily-learning-games 是纯网页应用，本工作流产出
#   - Windows 桌面安装包（Electron + NSIS exe）
#   - iOS 未签名 IPA（Capacitor 壳，可用 TrollStore 直装）
on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows 桌面版（NSIS exe）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 构建前端（相对路径，兼容本地加载）
        run: |
          npm ci
          npm run build -- --base=./
      - name: 拷贝前端产物到桌面工程
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path desktop\web -Force | Out-Null
          Copy-Item -Path dist\* -Destination desktop\web -Recurse -Force
      - name: 打包 Windows 安装包
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/dist/*.exe
          retention-days: 30

  ios:
    name: iOS 未签名 IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 构建前端
        run: |
          npm ci
          npm run build -- --base=./
      - name: 添加并同步 Web 资源到 iOS 工程
        run: |
          npm install @capacitor/core@^6 @capacitor/cli@^6
          npx cap add ios || true
          npx cap sync ios
          cd ios/App && pod install --repo-update || true
      - name: 归档（不签名）
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build
      - name: 打包为 IPA（Payload 结构，未签名）
        working-directory: ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry 每日打卡-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/App/每日打卡-ios-unsigned.ipa
          retention-days: 30